<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DROP IN | Advanced Snow & Skate</title><style>body{margin:0;background:#101114;color:#f6f6f6;font:16px system-ui}header{padding:35px max(20px,5vw);background:#1c1e22;border-bottom:3px solid #e9df31}h1{font-size:clamp(42px,7vw,84px);margin:0;letter-spacing:-3px}header p{color:#bbb}.bar{display:flex;gap:10px;flex-wrap:wrap;padding:20px max(20px,5vw)}button,input,select{background:#25282e;border:1px solid #454950;color:white;border-radius:8px;padding:11px;font:inherit}button{cursor:pointer}button.active{background:#e9df31;color:#111}main{padding:0 max(20px,5vw) 50px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}.tile{background:#1e2025;border-radius:12px;overflow:hidden}.tile img{width:100%;aspect-ratio:16/9;object-fit:cover}.tile .body{padding:15px}.tile a{color:white;text-decoration:none}.tile a:hover{text-decoration:underline}.meta{color:#aaa;font-size:13px}.tags{color:#e9df31;font-size:12px}#status{color:#aaa;margin-bottom:20px}footer{padding:20px 5vw;color:#aaa}</style></head><body><header><h1>DROP IN<span style="color:#e9df31">.</span></h1><p>THE LATEST ADVANCED SNOWBOARD + SKATEBOARD VIDEO PARTS, FILMS & EDITS</p></header><div class="bar"><button class="active" data-sport="all">All drops</button><button data-sport="snow">Snowboard</button><button data-sport="skate">Skateboard</button><select id="style"><option value="all">All styles</option></select><input id="query" placeholder="Search videos or channels" aria-label="Search videos"><button id="reload">Refresh</button></div><main><p id="status">Loading video feed…</p><div id="videos" class="grid"></div></main><footer>Videos are hosted on YouTube. Updated automatically when the collector runs.</footer><script>let all=[],sport='all';const el=id=>document.getElementById(id);document.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{sport=b.dataset.sport;document.querySelectorAll('[data-sport]').forEach(x=>x.classList.toggle('active',x===b));render()});el('query').oninput=render;el('style').onchange=render;el('reload').onclick=load;function render(){let q=el('query').value.toLowerCase(),style=el('style').value;let list=all.filter(v=>(sport==='all'||v.sport===sport)&&(style==='all'||v.styles.includes(style))&&(v.title+' '+v.channel).toLowerCase().includes(q));el('status').textContent=list.length+' videos • newest first';el('videos').innerHTML=list.map(v=>'<article class="tile"><a href="'+v.url+'" target="_blank" rel="noopener noreferrer"><img loading="lazy" src="'+v.thumbnail+'" alt=""><div class="body"><strong>'+escapeHtml(v.title)+'</strong></div></a><div class="body"><div class="meta">'+escapeHtml(v.channel)+' · '+new Date(v.published).toLocaleDateString()+'</div><div class="tags">'+v.sport.toUpperCase()+' / '+v.styles.map(escapeHtml).join(', ')+'</div></div></article>').join('')||'<p>No matching videos yet.</p>'}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{let r=await fetch('feed.json?ts='+Date.now());if(!r.ok)throw Error(r.status);let d=await r.json();all=d.videos||[];let styles=[...new Set(all.flatMap(v=>v.styles))].sort();let selected=el('style').value;el('style').innerHTML='<option value="all">All styles</option>'+styles.map(s=>'<option value="'+s+'">'+s+'</option>').join('');el('style').value=styles.includes(selected)?selected:'all';render();if(!all.length)el('status').textContent='Feed is waiting for its first YouTube API update.'}catch(e){el('status').textContent='Feed unavailable until the first collection run.'}}load();setInterval(load,900000)</script></body></html>
